
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE FINAL DRAW</title>

<style>
* { box-sizing:border-box; }

:root {
  --gold:#f5ca70;
  --light:#fff0bb;
}

body {
  margin:0;
  min-height:100vh;
  padding:20px;
  display:grid;
  place-items:center;
  background:radial-gradient(ellipse at center,#26344c,#080b13 75%);
  color:white;
  font-family:Arial,"Malgun Gothic",sans-serif;
}

.stage {
  width:min(1240px,94vw,calc((100svh - 40px)*16/9));
  aspect-ratio:16/9;
  min-height:550px;
  max-height:calc(100svh - 40px);
  padding:clamp(20px,3vw,42px);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  overflow:hidden;
  text-align:center;
  border:1px solid #92733d;
  border-radius:22px;
  background:radial-gradient(ellipse at center,#253149,#0a0e18 75%);
  box-shadow:0 0 60px #000;
}

.stage::before {
  content:"";
  position:absolute;
  inset:12px;
  border:1px solid rgba(245,202,112,.12);
  border-radius:15px;
  pointer-events:none;
}

header {
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.logo {
  color:var(--gold);
  font-weight:900;
  letter-spacing:4px;
  font-size:17px;
}

button {
  cursor:pointer;
  font-weight:bold;
}

.guide,.sound {
  padding:11px 18px;
  border:1px solid #92733d;
  border-radius:30px;
  background:#172237;
  color:var(--light);
}

.main {
  z-index:1;
  margin:auto 0;
}

.eyebrow {
  color:var(--gold);
  letter-spacing:7px;
  font-size:13px;
  font-weight:bold;
}

h1 {
  margin:15px 0;
  font-size:clamp(38px,5.5vw,68px);
  color:var(--light);
  text-shadow:0 0 30px #dca63e;
  letter-spacing:3px;
}

.subtitle {
  color:#bac5d8;
  letter-spacing:2px;
  font-size:clamp(13px,1.5vw,18px);
}

.countdown {
  height:65px;
  margin-top:15px;
  font-size:50px;
  font-weight:900;
  color:var(--gold);
  text-shadow:0 0 25px #f5b942;
}

.balls {
  width:min(900px,95%);
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:clamp(8px,2vw,24px);
}

.ball {
  width:100%;
  max-width:125px;
  aspect-ratio:1;
  margin:auto;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  border:2px solid #68758b;
  background:radial-gradient(circle at 35% 30%,#44516a,#182236);
  color:#e0e6f0;
  font-size:clamp(23px,4vw,43px);
  font-weight:900;
  box-shadow:inset 0 0 15px #000;
}

.spinning {
  animation:spin .12s infinite alternate;
}

.revealed {
  color:#33200a;
  border:3px solid #fff2bc;
  background:radial-gradient(circle at 34% 27%,#fffbdc,#f5ce70 48%,#b77b1e);
  box-shadow:0 0 35px #f5ca70;
  animation:reveal .65s;
}

.last {
  box-shadow:0 0 30px #fff1ac,0 0 80px #ffb72d;
}

@keyframes spin {
  from {transform:translateY(-3px) rotate(-5deg);}
  to {transform:translateY(3px) rotate(5deg);}
}

@keyframes reveal {
  0% {transform:scale(.1);opacity:0;}
  70% {transform:scale(1.25);}
  100% {transform:scale(1);opacity:1;}
}

.status {
  min-height:35px;
  margin:20px 0;
  color:var(--gold);
  font-size:clamp(16px,2vw,23px);
  font-weight:bold;
}

.start {
  padding:19px 45px;
  min-width:290px;
  border:0;
  border-radius:50px;
  background:linear-gradient(120deg,#fff0ad,#f2c35a,#c88a28);
  color:#271a06;
  font-size:19px;
  font-weight:900;
  box-shadow:0 0 30px #c38b32;
  transition:.25s;
}

.start:hover:not(:disabled) {
  transform:scale(1.04);
  box-shadow:0 0 45px #f5ca70;
}

.start:disabled {opacity:.5;}

footer {
  z-index:1;
  color:#78869c;
  font-size:11px;
  letter-spacing:3px;
}

.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:#000d;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal.open {display:flex;}

.modal-box {
  width:min(600px,100%);
  max-height:85vh;
  overflow:auto;
  padding:28px;
  border:1px solid var(--gold);
  border-radius:20px;
  background:#172237;
}

.modal-box h2 {
  color:var(--gold);
  text-align:center;
}

.game-card {
  padding:15px;
  margin:12px 0;
  border:1px solid #66532e;
  border-radius:10px;
  text-align:left;
}

.game-card h3 {color:var(--light);}

.game-card p {
  color:#c4ccda;
  line-height:1.7;
  white-space:pre-wrap;
}

.close {
  display:block;
  margin:20px auto 0;
  padding:12px 35px;
  background:transparent;
  border:1px solid var(--gold);
  color:white;
  border-radius:30px;
}

#fireworks {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:30;
  pointer-events:none;
}

@media(max-width:700px) {
  body {padding:8px;}
  .stage {
    width:96vw;
    min-height:700px;
    max-height:none;
    aspect-ratio:auto;
    padding:20px 12px;
  }
  header {flex-direction:column;}
  .balls {
    grid-template-columns:repeat(3,1fr);
    max-width:380px;
    gap:15px;
  }
  .ball {width:85%;}
  .start {width:90%;min-width:0;}
  .eyebrow {letter-spacing:3px;}
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="stage">

<header>
  <div class="logo">★ LUCKY LOTTO ★</div>

  <div style="display:flex;gap:10px;">
    <button class="guide" onclick="openGuide()">
      다른 게임 안내
    </button>
    <button class="sound" id="soundButton" onclick="toggleSound()">
      🔊 SOUND ON
    </button>
  </div>
</header>

<main class="main">

  <div class="eyebrow" id="eyebrow"></div>

  <h1 id="title"></h1>

  <p class="subtitle" id="subtitle"></p>

  <div class="countdown" id="countdown"></div>

  <div class="balls" id="balls">
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
  </div>

  <div class="status" id="status"></div>

  <button class="start" id="startButton" onclick="startDraw()">
    추첨 시작
  </button>

</main>

<footer id="footer"></footer>

</div>

<div class="modal" id="guideModal">
  <div class="modal-box">
    <h2 id="guideTitle"></h2>
    <div id="gameList"></div>
    <button class="close" onclick="closeGuide()">닫기</button>
  </div>
</div>

<script>

/* ======================================
   1. 직접 수정하는 설정
====================================== */

const CONFIG = {

  eyebrow:"THE GRAND FINALE",
  title:"THE FINAL DRAW",
  subtitle:"축제의 마지막 순간, 행운의 주인공이 탄생한다.",
  footer:"ONE LAST CHANCE · ONE LUCKY WINNER",

  startText:"운명의 추첨을 시작한다",
  drawingText:"운명의 번호가 공개됩니다...",
  lastNumberText:"마지막 번호... 운명의 순간!",
  finishText:"오늘의 주인공이 탄생했습니다!",

  guideTitle:"OTHER GAMES",

  countdownSeconds:5,
  revealInterval:3600,
  lastNumberPause:3000,

  games:[
    {
      name:"게임 1",
      description:"첫 번째 게임의 설명을 입력하세요."
    },
    {
      name:"게임 2",
      description:"두 번째 게임의 설명을 입력하세요."
    },
    {
      name:"게임 3",
      description:"세 번째 게임의 설명을 입력하세요."
    }
  ]
};


/* ======================================
   2. 화면 문구 적용
====================================== */

document.getElementById("eyebrow").textContent=CONFIG.eyebrow;
document.getElementById("title").textContent=CONFIG.title;
document.getElementById("subtitle").textContent=CONFIG.subtitle;
document.getElementById("footer").textContent=CONFIG.footer;
document.getElementById("startButton").textContent=CONFIG.startText;
document.getElementById("guideTitle").textContent=CONFIG.guideTitle;


/* ======================================
   3. 사운드 시스템
   외부 음원 없이 직접 소리 생성
====================================== */

let audioContext=null;
let masterGain=null;
let soundEnabled=true;
let ambientNodes=[];
let ambientPlaying=false;
let spinInterval=null;

function initAudio() {

  if(audioContext) return;

  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if(!AudioContextClass) {
    soundEnabled=false;
    return;
  }

  audioContext=new AudioContextClass();

  masterGain=audioContext.createGain();
  masterGain.gain.value=0.75;
  masterGain.connect(audioContext.destination);

}

function tone(frequency,duration,type="sine",volume=0.2,delay=0) {

  if(!soundEnabled || !audioContext) return;

  const now=audioContext.currentTime+delay;

  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();

  osc.type=type;
  osc.frequency.setValueAtTime(frequency,now);

  gain.gain.setValueAtTime(0.001,now);
  gain.gain.exponentialRampToValueAtTime(volume,now+0.025);
  gain.gain.exponentialRampToValueAtTime(0.001,now+duration);

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start(now);
  osc.stop(now+duration+0.05);

}


// 웅장한 배경음악
function startAmbient() {

  if(!soundEnabled || !audioContext || ambientPlaying) return;

  ambientPlaying=true;

  const notes=[55,82.41,110,164.81];

  notes.forEach((frequency,index)=>{

    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    const filter=audioContext.createBiquadFilter();

    osc.type=index===0?"triangle":"sine";
    osc.frequency.value=frequency;

    filter.type="lowpass";
    filter.frequency.value=350;

    gain.gain.value=index===0?0.055:0.025;

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    osc.start();

    ambientNodes.push(osc);

  });

}


// 배경음악 종료
function stopAmbient() {

  ambientNodes.forEach(osc=>{
    try {osc.stop();} catch(e){}
  });

  ambientNodes=[];
  ambientPlaying=false;

}


// 카운트다운 효과음
function countSound() {

  tone(880,0.18,"sine",0.25);
  tone(440,0.22,"triangle",0.12,0.04);

}


// 번호 공개 효과음
function revealSound() {

  tone(110,0.35,"sine",0.4);
  tone(440,0.15,"triangle",0.16,0.03);
  tone(660,0.2,"sine",0.1,0.08);

}


// 회전 기계음
function spinSound() {

  if(!soundEnabled) return;

  tone(190+Math.random()*100,0.045,"square",0.035);

}


// 마지막 번호 긴장 효과음
function suspenseSound() {

  tone(220,0.8,"sawtooth",0.08);
  tone(330,1.2,"sine",0.12,0.5);
  tone(440,1.5,"sine",0.13,1.1);
  tone(660,1.5,"sine",0.14,1.8);

}


// 최종 피날레 팡파르
function finaleSound() {

  const notes=[
    [392,0],
    [523.25,0.3],
    [659.25,0.6],
    [783.99,1.0],
    [1046.5,1.5],
    [783.99,2.0],
    [1046.5,2.5],
    [1318.5,3.0]
  ];

  notes.forEach(([frequency,delay])=>{
    tone(frequency,0.75,"triangle",0.19,delay);
  });

  // 묵직한 피날레 저음
  tone(65.4,2.5,"sine",0.35,0);
  tone(130.8,2, "sine",0.2,0.1);

}


// 소리 ON/OFF
function toggleSound() {

  initAudio();

  soundEnabled=!soundEnabled;

  document.getElementById("soundButton").textContent=
    soundEnabled?"🔊 SOUND ON":"🔇 SOUND OFF";

  if(!soundEnabled) {

    masterGain.gain.setTargetAtTime(
      0,audioContext.currentTime,0.04
    );

    stopAmbient();

  } else {

    masterGain.gain.setTargetAtTime(
      0.75,audioContext.currentTime,0.05
    );

    if(isDrawing) startAmbient();

  }

}


/* ======================================
   4. 균등한 무작위 번호 추첨
====================================== */

function randomInt(max) {

  const range=0x100000000;
  const limit=Math.floor(range/max)*max;
  const array=new Uint32Array(1);
  let value;

  do {
    crypto.getRandomValues(array);
    value=array[0];
  } while(value>=limit);

  return value%max;

}

function drawNumbers() {

  const numbers=Array.from(
    {length:45},
    (_,i)=>i+1
  );

  for(let i=44;i>0;i--) {

    const j=randomInt(i+1);

    [numbers[i],numbers[j]]=
    [numbers[j],numbers[i]];

  }

  return numbers.slice(0,6);

}


/* ======================================
   5. 공통 변수
====================================== */

const balls=document.querySelectorAll(".ball");

const statusText=document.getElementById("status");
const countdownText=document.getElementById("countdown");
const startButton=document.getElementById("startButton");

let isDrawing=false;
let resultNumbers=[];

function wait(ms) {
  return new Promise(resolve=>setTimeout(resolve,ms));
}


/* ======================================
   6. 번호 공개
====================================== */

function showNumber(ball,number,isLast=false) {

  ball.textContent=String(number).padStart(2,"0");

  ball.className="ball revealed";

  if(isLast) ball.classList.add("last");

}


/* ======================================
   7. 로또 추첨
====================================== */

async function startDraw() {

  if(isDrawing) return;

  if(!window.crypto ||
     typeof crypto.getRandomValues!=="function") {

    statusText.textContent=
      "HTTPS 환경에서 실행해주세요.";

    return;

  }

  initAudio();

  if(audioContext.state==="suspended") {
    await audioContext.resume();
  }

  isDrawing=true;

  startButton.disabled=true;
  startButton.textContent="추첨 진행 중...";

  resultNumbers=drawNumbers();

  balls.forEach(ball=>{
    ball.textContent="?";
    ball.className="ball";
  });

  countdownText.textContent="";
  statusText.textContent="추첨 장치를 가동합니다...";

  if(soundEnabled) startAmbient();

  // 회전 애니메이션
  const spinTimer=setInterval(()=>{

    balls.forEach(ball=>{

      if(!ball.classList.contains("revealed")) {

        ball.textContent=
          String(randomInt(45)+1).padStart(2,"0");

        ball.classList.add("spinning");

      }

    });

    spinSound();

  },160);

  try {

    // 카운트다운
    for(let i=CONFIG.countdownSeconds;i>0;i--) {

      countdownText.textContent=i;

      statusText.textContent=
        "운명의 순간이 다가옵니다...";

      countSound();

      await wait(1000);

    }

    countdownText.textContent="START!";

    tone(660,0.6,"triangle",0.25);
    tone(880,0.8,"sine",0.18,0.2);

    // 6개 번호 순차 공개
    for(let i=0;i<6;i++) {

      if(i===5) {

        statusText.textContent=CONFIG.lastNumberText;

        suspenseSound();

        await wait(CONFIG.lastNumberPause);

      } else {

        statusText.textContent=
          `${i+1}번째 행운의 번호 공개`;

      }

      await wait(CONFIG.revealInterval);

      showNumber(balls[i],resultNumbers[i],i===5);

      revealSound();

      await wait(500);

    }

    countdownText.textContent="";
    statusText.textContent=CONFIG.finishText;

    startButton.textContent="다시 추첨하기";

    stopAmbient();

    finaleSound();
    launchFireworks();

  } catch(error) {

    console.error(error);
    statusText.textContent="추첨 중 오류가 발생했습니다.";

  } finally {

    clearInterval(spinTimer);

    if(soundEnabled) stopAmbient();

    startButton.disabled=false;

    if(statusText.textContent!==CONFIG.finishText) {
      startButton.textContent=CONFIG.startText;
    }

    isDrawing=false;

  }

}


/* ======================================
   8. 다른 게임 안내
====================================== */

function openGuide() {

  const modal=document.getElementById("guideModal");
  const gameList=document.getElementById("gameList");

  gameList.replaceChildren();

  CONFIG.games.forEach(game=>{

    const card=document.createElement("div");
    card.className="game-card";

    const title=document.createElement("h3");
    title.textContent=game.name;

    const description=document.createElement("p");
    description.textContent=game.description;

    card.append(title,description);
    gameList.append(card);

  });

  modal.classList.add("open");

}

function closeGuide() {
  document.getElementById("guideModal").classList.remove("open");
}

document.getElementById("guideModal")
.addEventListener("click",event=>{

  if(event.target.id==="guideModal") closeGuide();

});

document.addEventListener("keydown",event=>{

  if(event.key==="Escape") closeGuide();

});


/* ======================================
   9. 폭죽 효과
====================================== */

function launchFireworks() {

  const canvas=document.getElementById("fireworks");
  const ctx=canvas.getContext("2d");

  const dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=window.innerWidth*dpr;
  canvas.height=window.innerHeight*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  const colors=[
    "#ffd76d",
    "#fff2bb",
    "#ff9e35",
    "#ffffff",
    "#f3c454"
  ];

  let particles=[];
  const startTime=performance.now();

  function createBurst() {

    const x=window.innerWidth*(0.2+Math.random()*0.6);
    const y=window.innerHeight*(0.15+Math.random()*0.4);

    const color=colors[
      Math.floor(Math.random()*colors.length)
    ];

    for(let i=0;i<65;i++) {

      const angle=Math.random()*Math.PI*2;
      const speed=2+Math.random()*6;

      particles.push({

        x,y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,
        life:1,
        size:2+Math.random()*3,
        color

      });

    }

  }

  createBurst();

  setTimeout(createBurst,450);
  setTimeout(createBurst,950);
  setTimeout(createBurst,1500);

  function animate() {

    const elapsed=performance.now()-startTime;

    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);

    particles=particles.filter(p=>p.life>0);

    particles.forEach(p=>{

      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=0.045;
      p.vx*=0.99;
      p.life-=0.009;

      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fill();

    });

    ctx.globalAlpha=1;

    if(elapsed<4500||particles.length>0) {

      requestAnimationFrame(animate);

    } else {

      ctx.clearRect(0,0,window.innerWidth,window.innerHeight);

    }

  }

  requestAnimationFrame(animate);

}

</script>

</body>
</html>
